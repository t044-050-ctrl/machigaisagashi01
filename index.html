            100% { transform: scale(1); opacity: 1; }

        // Sound System (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;

            if (type === 'found') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.12); // D6
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.25);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(130, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderThemeTabs();
            generateGame();
        });

        function renderThemeTabs() {
            const container = document.getElementById('themeTabsContainer');
            container.innerHTML = '';

            themes.forEach((theme, idx) => {
                const btn = document.createElement('button');
                const isActive = idx === currentThemeIndex;
                btn.className = `flex items-center gap-1 px-2 py-1 rounded-lg font-bold text-xs shrink-0 transition-all cursor-pointer ${
                    isActive 
                    ? 'bg-sky-500 text-white shadow-md ring-1 ring-sky-300' 
                    : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                }`;
                btn.onclick = () => selectTheme(idx);
                btn.innerHTML = `
                    <span class="whitespace-nowrap">${theme.symbol} ${theme.name}</span>
                `;
                container.appendChild(btn);
            });

            const curr = themes[currentThemeIndex];
            document.getElementById('currentThemeTitle').innerText = `${curr.symbol} ${curr.name}`;
            updateScoreText();
            document.getElementById('lapBadge').innerText = `${lapCount}しゅうめ`;
        }

        function updateScoreText() {
            const totalToFind = cardCount - 1;
            document.getElementById('scoreText').innerText = `${foundCards.size} / ${totalToFind}`;
        }

        function selectTheme(index) {
            currentThemeIndex = index;
            renderThemeTabs();
            generateGame();
        }

        function setCardCount(count) {
            cardCount = count;
            ['btn4', 'btn9', 'btn12'].forEach(id => {
                const btn = document.getElementById(id);
                const selected = Number(id.replace('btn', '')) === count;
                btn.className = selected
                    ? 'px-2 py-0.5 rounded transition-all bg-sky-500 text-white shadow'
                    : 'px-2 py-0.5 rounded transition-all text-slate-300 hover:text-white';
            });
            generateGame();
        }

        function nextTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            if (currentThemeIndex === 0) {
                lapCount++;
            }
            renderThemeTabs();
            generateGame();
        }

        function resetCurrentGame() {
            generateGame();

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;

                { diffType: 'petal_count', spot: { cx: 100, cy: 90, r: 22 } },

            ]
        };

        // 目で見て分かりやすい違いを優先し、同じ見た目に見える微妙な差は出題候補から外す。
        const visibleVariationTypes = {"dolphin": ["parent_fin_up", "parent_fin_down", "parent_fin_left", "parent_fin_right", "parent_tail", "bubble_top", "no_ball", "sun_rays", "child_fin", "bubble_low", "parent_mouth"], "elephant": ["no_balloon3", "no_hat", "trunk_shape", "eye_shape", "balloon_string", "cloud_left", "hat_pom", "tail_present", "belly_color", "balloon_spotted", "apple_trunk"], "lion": ["crown_gem", "mouth_open", "no_leaves", "eye_wink", "blush_star", "crown_shape", "mane_size", "whisker", "leaf_right", "crown_side_gems", "teeth_show"], "astronaut": ["flag_icon", "no_stars", "moon_crater", "suit_stripe", "rocket_flame", "star_big", "helmet_antenna", "earth_bg", "moon_shape", "planet_ring", "antenna_light"], "owl": ["no_chest", "eye_pupil", "branch_leaves", "moon_face", "ear_tufts", "star_night", "wing_pose", "sleeping", "bow_tie", "tail_feather", "nest_apple"], "train": ["smoke_few", "no_rainbow", "window_light", "chimney_shape", "smoke_shape", "headlight", "engine_front", "driver_hat", "wheel_count", "track_flowers", "bird_flying"], "bees": ["bee_single", "stem_leaf", "bee_stripes", "bee_wing", "flower_face", "bee_crown", "honey_drop", "ladybug", "bee2_position", "petal_count", "butterfly"], "cat_dog": ["accessory_bone", "dog_ears", "cat_eyes", "no_accessory", "cat_whiskers", "dog_tongue", "heart_between", "cat_stripes", "dog_spot", "ball_toy", "cat_bell"]};

        function generateGame() {
            foundCards.clear();
            activeCardConfigs = {};
            updateScoreText();

            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (cardCount === 4) {
                grid.className = "h-full w-full grid grid-cols-2 grid-rows-2 gap-2 sm:gap-3";
            } else if (cardCount === 12) {
                grid.className = "h-full w-full grid grid-cols-4 grid-rows-3 gap-1.5 sm:gap-2";
            } else {
                grid.className = "h-full w-full grid grid-cols-3 grid-rows-3 gap-1.5 sm:gap-2";
            }

            const activeTheme = themes[currentThemeIndex].id;
            const totalSelectableCards = cardCount - 1;
            correctIndex = Math.floor(Math.random() * totalSelectableCards) + 2;

            const rawVars = themeVariations[activeTheme] || themeVariations['dolphin'];
            const preferredTypes = visibleVariationTypes[activeTheme] || visibleVariationTypes.dolphin;
            const originalSvg = drawIllustration(activeTheme, { isOriginal: true }, false);

            // 描画結果そのものを基準に重複を判定する。diffType名が違っても、
            // 実際のSVGが同じなら採用しない。元絵と同じ描画結果も除外する。
            const seenSvg = new Set([originalSvg]);
            const seenDiffTypes = new Set();
            const uniqueVars = [];
            const orderedTypes = [...preferredTypes];
            for (const type of orderedTypes) {
                if (seenDiffTypes.has(type)) continue;
                const item = rawVars.find(v => v.diffType === type);
                if (!item) continue;
                const rendered = drawIllustration(activeTheme, { isOriginal: false, diffType: item.diffType }, false);
                if (seenSvg.has(rendered)) continue;
                seenDiffTypes.add(type);
                seenSvg.add(rendered);
                uniqueVars.push(item);
            }

            const shuffledVars = shuffleArray(uniqueVars);
            const requiredDifferences = cardCount - 2; // 4枚なら2種類、9枚なら7種類、12枚なら10種類
            if (shuffledVars.length < requiredDifferences) {
                console.error(`このテーマで重複なしに用意できる絵が不足しています: ${activeTheme}。必要=${requiredDifferences}、利用可能=${shuffledVars.length}`);
            }

            // 1. Target Card
            activeCardConfigs[1] = { isOriginal: true };
            const card1 = document.createElement('div');
            card1.className = 'bg-white rounded-xl border-2 border-sky-400 overflow-hidden shadow flex flex-col justify-between relative h-full';
            card1.innerHTML = `
                <div class="bg-sky-500 text-white px-2 py-0.5 text-[11px] font-black flex items-center gap-1 shrink-0">
                    <span>👑</span>
                    <span>1 もとのえ</span>
                </div>
                <div class="p-1 bg-sky-50/50 flex-1 flex items-center justify-center overflow-hidden">
                    <div class="w-full h-full ${cardCount === 4 ? 'max-w-[min(42vh,42vw)] max-h-[min(42vh,42vw)]' : 'max-w-[150px] max-h-[150px]'} aspect-square flex items-center justify-center">
                        ${drawIllustration(activeTheme, { isOriginal: true })}
                    </div>
                </div>
                <div class="bg-sky-100 text-sky-800 text-center py-0.5 text-[10px] sm:text-[11px] font-bold border-t border-sky-200 shrink-0">
                    ✓ これを見比べる
                </div>
            `;
            grid.appendChild(card1);

            // 2. Option Cards
            let varIdx = 0;
            for (let cardNum = 2; cardNum <= cardCount; cardNum++) {
                const isCorrect = (cardNum === correctIndex);
                let diffConfig;

                if (isCorrect) {
                    diffConfig = { isOriginal: true };
                } else {
                    const item = shuffledVars[varIdx];
                    varIdx++;
                    // 重複候補を再利用しない。候補不足時も元絵を複製せず、明示的なエラー表示用に保護する。
                    if (!item) {
                        // 候補不足時も元絵を複製しない。カード番号ごとに異なる位置・形の目印を描く。
                        diffConfig = { isOriginal: false, diffType: '__missing_variation__', fallbackIndex: cardNum, spot: { cx: 35 + ((cardNum * 29) % 130), cy: 35 + ((cardNum * 41) % 130), r: 22 } };
                    } else {
                        diffConfig = {
                            isOriginal: false,
                            diffType: item.diffType,
                            spot: item.spot
                        };
                    }
                }

                activeCardConfigs[cardNum] = diffConfig;

                const cardEl = document.createElement('div');
                cardEl.className = 'card-hover bg-white rounded-xl border-2 border-slate-300 overflow-hidden shadow-sm flex flex-col justify-between relative group cursor-pointer h-full';
                cardEl.id = `card-${cardNum}`;

                cardEl.innerHTML = `
                    <div class="absolute top-1 left-1 z-10 bg-slate-800 text-white font-black text-[11px] w-5 h-5 rounded-md flex items-center justify-center shadow">
                        ${cardNum}
                    </div>

                    <div class="p-1 pt-4 bg-white flex-1 flex items-center justify-center overflow-hidden" onclick="handleCardClick(event, ${cardNum})">
                        <div id="img-container-${cardNum}" class="w-full h-full ${cardCount === 4 ? 'max-w-[min(42vh,42vw)] max-h-[min(42vh,42vw)]' : 'max-w-[150px] max-h-[150px]'} aspect-square flex items-center justify-center relative">
                            ${drawIllustration(activeTheme, diffConfig, false)}
                        </div>
                    </div>

                    <div id="stamp-${cardNum}" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 z-20">
                        <div class="w-20 h-20 border-4 border-emerald-500 text-emerald-600 rounded-full flex items-center justify-center font-black text-[11px] border-dashed transform -rotate-12 bg-white/95 shadow-xl text-center leading-tight">
                            たいへん<br>よくできました
                        </div>
                    </div>

                    <button onclick="handleMatchBtnClick(${cardNum})" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 active:scale-98 text-slate-900 font-extrabold py-1 px-1 text-[11px] sm:text-xs flex items-center justify-center gap-0.5 border-t border-amber-300 shadow-inner shrink-0">
                        <span>★ ★ これがおなじえ！</span>
                    </button>
                `;

                grid.appendChild(cardEl);
            }
        }

        function handleCardClick(event, cardNum) {
            if (foundCards.has(cardNum)) return;

            // 「おなじえ」はカード下のボタンでのみ回答する。
            if (cardNum === correctIndex) return;

            const config = activeCardConfigs[cardNum];
            if (!config || !config.spot) return;

            // SVGの表示倍率に左右されず、タップ位置をviewBox座標へ変換する。
            const svg = event.currentTarget.querySelector('svg');
            if (!svg) return;
            const matrix = svg.getScreenCTM();
            if (!matrix) return;
            const point = svg.createSVGPoint();
            point.x = event.clientX;
            point.y = event.clientY;
            const svgPoint = point.matrixTransform(matrix.inverse());
            const dx = svgPoint.x - config.spot.cx;
            const dy = svgPoint.y - config.spot.cy;
            const hitRadius = config.spot.r + 7;

            if (dx * dx + dy * dy <= hitRadius * hitRadius) {
                markCardAsFound(cardNum, false);
            } else {
                playSound('wrong');
            }
        }

        function handleMatchBtnClick(cardNum) {
            if (foundCards.has(cardNum)) return;
            const isCorrect = (cardNum === correctIndex);

            if (isCorrect) {
                markCardAsFound(cardNum, true);
            } else {
                playSound('wrong');
                const cardEl = document.getElementById(`card-${cardNum}`);
                cardEl.classList.add('translate-x-1');
                setTimeout(() => cardEl.classList.remove('translate-x-1'), 80);
                setTimeout(() => cardEl.classList.add('-translate-x-1'), 160);
                setTimeout(() => cardEl.classList.remove('-translate-x-1'), 240);
            }
        }

        function markCardAsFound(cardNum, isCorrect) {
            foundCards.add(cardNum);
            updateScoreText();

            const cardEl = document.getElementById(`card-${cardNum}`);
            const imgContainer = document.getElementById(`img-container-${cardNum}`);
            const diffConfig = activeCardConfigs[cardNum];

            if (isCorrect) {
                playSound('correct');
                const stamp = document.getElementById(`stamp-${cardNum}`);
                if (stamp) {
                    stamp.classList.remove('opacity-0');
                    stamp.classList.add('animate-stamp');
                }
                cardEl.classList.remove('border-slate-300');
                cardEl.classList.add('border-emerald-500', 'ring-2', 'ring-emerald-300');
            } else {
                playSound('found');
                const activeTheme = themes[currentThemeIndex].id;
                imgContainer.innerHTML = drawIllustration(activeTheme, diffConfig, true);

                cardEl.classList.remove('border-slate-300');
                cardEl.classList.add('border-rose-400', 'bg-rose-50/20');
            }

            const totalToFind = cardCount - 1;
            if (foundCards.size === totalToFind) {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    const modalPreview = document.getElementById('modalCardPreview');
                    modalPreview.innerHTML = drawIllustration(themes[currentThemeIndex].id, { isOriginal: true }, false);
                    document.getElementById('successModal').classList.remove('hidden');
                }, 600);
            }
        }

        function closeModalNext() {
            document.getElementById('successModal').classList.add('hidden');
            nextTheme();
        }

        // SVG RENDERING ENGINE
        function drawIllustration(theme, config, showRedCircle = false) {
            const isOriginal = config.isOriginal;
            const diffType = config.diffType || 'parent_color';

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-full h-full select-none">
            <defs>
                <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
                    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
                </filter>
                <radialGradient id="blush">
                    <stop offset="0%" stop-color="#ff718d" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#ff718d" stop-opacity="0"/>
                </radialGradient>
            `;

            switch(theme) {
                case 'dolphin': svg += renderDolphin(isOriginal, diffType); break;
                case 'elephant': svg += renderElephant(isOriginal, diffType); break;
                case 'lion': svg += renderLion(isOriginal, diffType); break;
                case 'astronaut': svg += renderAstronaut(isOriginal, diffType); break;
                case 'owl': svg += renderOwl(isOriginal, diffType); break;
                case 'train': svg += renderTrain(isOriginal, diffType); break;
                case 'bees': svg += renderBees(isOriginal, diffType); break;
                case 'cat_dog': svg += renderCatDog(isOriginal, diffType); break;
                default: svg += renderDolphin(isOriginal, diffType);
            }

            if (!isOriginal && diffType === '__missing_variation__') {
                // 通常は十分な候補がある想定。候補不足時も、カードごとに違う位置・形で
                // はっきりした目印を描き、元絵や他の不足カードをそのまま複製しない。
                const idx = Number(config.fallbackIndex || 2);
                const x = 35 + ((idx * 29) % 130);
                const y = 35 + ((idx * 41) % 130);
                const shapes = [
                    `<circle cx="${x}" cy="${y}" r="15" fill="#f43f5e" stroke="#ffffff" stroke-width="3"/>`,
                    `<rect x="${x-13}" y="${y-13}" width="26" height="26" rx="3" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>`,
                    `<path d="M${x} ${y-17} L${x+16} ${y+13} L${x-16} ${y+13} Z" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>`,
                    `<path d="M${x} ${y-18} L${x+5} ${y-5} L${x+19} ${y-5} L${x+8} ${y+4} L${x+12} ${y+18} L${x} ${y+9} L${x-12} ${y+18} L${x-8} ${y+4} L${x-19} ${y-5} L${x-5} ${y-5} Z" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>`
                ];
                svg += shapes[(idx - 2) % shapes.length];
            }

            if (showRedCircle && !isOriginal && config.spot) {
                const sp = config.spot;
                svg += `
                    <g class="animate-red-circle" style="transform-origin: ${sp.cx}px ${sp.cy}px;">
                        <circle cx="${sp.cx}" cy="${sp.cy}" r="${sp.r + 3}" stroke="#fca5a5" stroke-width="2" fill="none" opacity="0.6"/>
                        <circle cx="${sp.cx}" cy="${sp.cy}" r="${sp.r}" stroke="#ef4444" stroke-width="4.5" fill="rgba(239, 68, 68, 0.12)" filter="url(#shadow)"/>
                        <circle cx="${sp.cx}" cy="${sp.cy}" r="${sp.r - 3}" stroke="#dc2626" stroke-width="1.5" fill="none"/>
                    </g>
                `;
            }

            svg += `</svg>`;
            return svg;
        }

        // 1. DOLPHIN
        function renderDolphin(isOriginal, diffType) {
            let parentColor1 = "#0284c7", parentColor2 = "#38bdf8", childColor = "#7dd3fc";
            let parentEye = "happy", ballColor = "#f43f5e", sunColor = "#fbbf24";
            let bubbleTop = "circle", bubbleMid = "#ffffff", bubbleLow = "circle";
            let finColor = parentColor1, tailColor = parentColor1, ballStyle = "stripe";
            let parentFinPath = "M 88 95 C 92 78 106 80 102 98 Z";
            let seaGrad = ["#38bdf8", "#0284c7"], sunRays = false, parentBelly = "#f0f9ff";
            let parentBlush = true, childEye = "normal", parentMouth = "closed";
            let skyGrad = ["#e0f2fe", "#bae6fd"], childFin = true, ballType = "ball";

            if (!isOriginal) {
                switch(diffType) {
                    case 'parent_color': parentColor1 = "#8b5cf6"; parentColor2 = "#a78bfa"; break;
                    case 'parent_eye': parentEye = "wink"; break;
                    case 'bubble_top': bubbleTop = "star"; break;
                    case 'ball_color': ballColor = "#10b981"; break;
                    case 'sun_color': sunColor = "#f97316"; break;
                    case 'child_color': childColor = "#f472b6"; break;
                    case 'parent_fin': finColor = "#f59e0b"; break;
                    case 'parent_fin_up': parentFinPath = "M 88 95 C 86 65 108 65 102 98 Z"; break;
                    case 'parent_fin_down': parentFinPath = "M 88 95 C 95 112 112 108 102 98 Z"; break;
                    case 'parent_fin_left': parentFinPath = "M 88 95 C 68 80 70 101 102 98 Z"; break;
                    case 'parent_fin_right': parentFinPath = "M 88 95 C 106 74 120 86 102 98 Z"; break;
                    case 'parent_tail': tailColor = "#ec4899"; break;
                    case 'ball_stripe': ballStyle = "dots"; break;
                    case 'sea_color': seaGrad = ["#1e3a8a", "#0f172a"]; break;
                    case 'sun_rays': sunRays = true; break;
                    case 'bubble_mid': bubbleMid = "#fde047"; break;
                    case 'parent_belly': parentBelly = "#fde047"; break;
                    case 'parent_blush': parentBlush = false; break;
                    case 'child_eye': childEye = "happy"; break;
                    case 'bubble_low': bubbleLow = "heart"; break;
                    case 'parent_mouth': parentMouth = "open"; break;
                    case 'sky_color': skyGrad = ["#fbcfe8", "#f472b6"]; break;
                    case 'child_fin': childFin = false; break;
                    case 'no_ball': ballType = "note"; break;
                }
            }

            return `
                <linearGradient id="skyDolph" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${skyGrad[0]}"/>
                    <stop offset="100%" stop-color="${skyGrad[1]}"/>
                </linearGradient>
                <linearGradient id="seaDolph" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${seaGrad[0]}"/>
                    <stop offset="100%" stop-color="${seaGrad[1]}"/>
                </linearGradient>
                <linearGradient id="dolphGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${parentColor1}"/>
                    <stop offset="100%" stop-color="${parentColor2}"/>
                </linearGradient>
            </defs>

            <rect width="200" height="200" rx="16" fill="url(#skyDolph)"/>
            <path d="M 0 125 Q 50 115 100 125 T 200 125 L 200 200 L 0 200 Z" fill="url(#seaDolph)"/>

            <g filter="url(#shadow)">
                <circle cx="168" cy="36" r="16" fill="${sunColor}"/>
                ${sunRays ? `<path d="M 168 12 L 168 5 M 168 67 L 168 60 M 144 36 L 137 36 M 199 36 L 192 36" stroke="${sunColor}" stroke-width="3" stroke-linecap="round"/>` : ''}
            </g>

            ${ballType === 'ball' ? `
                <g transform="translate(150, 80)" filter="url(#shadow)">
                    <circle cx="0" cy="0" r="12" fill="${ballColor}"/>
                    ${ballStyle === 'stripe' ? `<path d="M -12 0 A 12 12 0 0 1 12 0 Z" fill="#ffffff"/>` : `<circle cx="-4" cy="-4" r="3" fill="#ffffff"/><circle cx="4" cy="4" r="3" fill="#ffffff"/>`}
                    <path d="M 0 -12 A 12 12 0 0 1 0 12 Z" fill="#f59e0b"/>
                </g>
            ` : `
                <text x="140" y="85" font-size="22" filter="url(#shadow)">🎵</text>
            `}

            <g filter="url(#shadow)">
                <path d="M 35 130 C 45 85 110 75 145 102 C 158 112 150 126 132 124 C 98 122 65 138 35 130 Z" fill="url(#dolphGrad)" stroke="#0369a1" stroke-width="2"/>
                <path d="M 58 126 C 85 118 120 120 132 122 C 120 129 90 132 58 126 Z" fill="${parentBelly}"/>
                ${diffType === 'parent_tail' ? `
                    <path d="M 39 126 C 20 112 4 126 10 140 C 16 154 32 148 43 128 Z" fill="#ec4899" stroke="#9d174d" stroke-width="2.5"/>
                    <path d="M 15 132 L 29 139" stroke="#fce7f3" stroke-width="2.5" stroke-linecap="round"/>
                ` : `<path d="M 36 128 C 20 122 15 138 24 142 C 32 144 40 134 42 129 Z" fill="${tailColor}" stroke="#0369a1" stroke-width="2"/>`}
                <path d="${parentFinPath}" fill="${finColor}" stroke="#0369a1" stroke-width="1.5"/>

                ${parentEye === 'happy' ? `
                    <circle cx="128" cy="104" r="4" fill="#0f172a"/>
                    <circle cx="129.5" cy="102.5" r="1.5" fill="#ffffff"/>
                ` : `
                    <path d="M 124 105 Q 128 100 132 105" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                `}

                ${parentMouth === 'open' ? `<ellipse cx="140" cy="112" rx="3" ry="4" fill="#0f172a"/>` : ''}
                ${parentBlush ? `<circle cx="122" cy="111" r="4.5" fill="url(#blush)"/>` : ''}
            </g>

            if (!isOriginal) {
                switch(diffType) {
                    case 'engine_color': engineColor = "#10b981"; break;
                    case 'cabin_color': cabinColor = "#8b5cf6"; break;
                    case 'smoke_few': smokeCount = 1; break;
                    case 'no_rainbow': showRainbow = false; break;
                    case 'wheel_color': wheelColor = "#3b82f6"; break;
                    case 'window_light': windowLight = true; break;
                    case 'chimney_shape': chimneyShape = "wide"; break;
                    case 'smoke_shape': smokeHeart = true; break;
                    case 'track_color': trackColor = "#78350f"; break;
                    case 'rainbow_color': rainbowReverse = true; break;
                    case 'headlight': headlight = true; break;
                    case 'cabin_stripes': cabinStripes = true; break;
                    case 'sky_cloud': skyCloud = true; break;
                    case 'engine_front': engineFrontStar = true; break;
                    case 'driver_hat': driverHat = true; break;
                    case 'wheel_count': wheelCount = 3; break;
                    case 'cabin_roof': cabinRoof = "#ef4444"; break;
                    case 'track_flowers': trackFlowers = true; break;
                    case 'bird_flying': birdFlying = true; break;
                    case 'sun_bg': sunBg = true; break;
                }
            }

            return `
                <linearGradient id="trainBg" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#bae6fd"/>
                    <stop offset="100%" stop-color="#e0f2fe"/>
                </linearGradient>
            </defs>
            <rect width="200" height="200" rx="16" fill="url(#trainBg)"/>

            ${sunBg ? `<circle cx="25" cy="25" r="15" fill="#fbbf24"/>` : ''}

            ${showRainbow ? `
                <path d="M 20 160 A 100 100 0 0 1 180 160" stroke="${rainbowReverse ? '#10b981' : '#f43f5e'}" stroke-width="4" fill="none" opacity="0.6"/>
                <path d="M 24 160 A 96 96 0 0 1 176 160" stroke="${rainbowReverse ? '#ec4899' : '#fbbf24'}" stroke-width="4" fill="none" opacity="0.6"/>
            ` : ''}

            ${skyCloud ? `<ellipse cx="160" cy="35" rx="18" ry="10" fill="#ffffff"/>` : ''}
            ${birdFlying ? `<text x="75" y="35" font-size="12">🐦</text>` : ''}

            <line x1="10" y1="160" x2="190" y2="160" stroke="${trackColor}" stroke-width="4"/>
            ${trackFlowers ? `<text x="160" y="172" font-size="12">🌸</text>` : ''}

            <g fill="#ffffff" opacity="0.85">
                ${smokeHeart ? `<text x="35" y="55" font-size="14">❤️</text>` : `<circle cx="55" cy="70" r="10"/>`}
                ${smokeCount >= 2 ? `<circle cx="40" cy="52" r="14"/>` : ''}
                ${smokeCount >= 3 ? `<circle cx="20" cy="38" r="18"/>` : ''}
            </g>

            <g filter="url(#shadow)">
                <rect x="${chimneyShape === 'wide' ? '40' : '45'}" y="85" width="${chimneyShape === 'wide' ? '26' : '16'}" height="25" fill="#334155" rx="2"/>
                ${driverHat ? `<text x="48" y="72" font-size="14">🧢</text>` : ''}

                <rect x="35" y="110" width="70" height="38" fill="${engineColor}" rx="6" stroke="#1e293b" stroke-width="1.5"/>
                ${engineFrontStar ? `<text x="38" y="132" font-size="12">⭐</text>` : ''}

                ${headlight ? `<polygon points="35,120 15,110 15,138" fill="#fde047" opacity="0.7"/>` : ''}

                <rect x="95" y="90" width="55" height="58" fill="${cabinColor}" rx="6" stroke="#1e293b" stroke-width="1.5"/>
                <rect x="95" y="86" width="55" height="8" fill="${cabinRoof}"/>

                ${cabinStripes ? `<line x1="95" y1="130" x2="150" y2="130" stroke="#fde047" stroke-width="4"/>` : ''}

                <rect x="110" y="100" width="25" height="20" fill="#e0f2fe" rx="4" stroke="#1e293b" stroke-width="2"/>
                ${windowLight ? `<text x="115" y="116" font-size="12">🐻</text>` : ''}

                ${wheelCount === 2 ? `
                    <circle cx="55" cy="150" r="12" fill="${wheelColor}" stroke="#334155" stroke-width="3"/>
                    <circle cx="85" cy="150" r="12" fill="${wheelColor}" stroke="#334155" stroke-width="3"/>
                    <circle cx="125" cy="148" r="15" fill="${wheelColor}" stroke="#334155" stroke-width="3"/>
                ` : `
                    <circle cx="48" cy="150" r="9" fill="${wheelColor}" stroke="#334155" stroke-width="2"/>
                    <circle cx="70" cy="150" r="9" fill="${wheelColor}" stroke="#334155" stroke-width="2"/>
                    <circle cx="92" cy="150" r="9" fill="${wheelColor}" stroke="#334155" stroke-width="2"/>
                    <circle cx="125" cy="148" r="15" fill="${wheelColor}" stroke="#334155" stroke-width="3"/>
                `}
            </g>
            `;
        }

        // 7. BEES
        function renderBees(isOriginal, diffType) {
            let flowerPetal = "#f43f5e", beeCount = 2, flowerCenter = "#f59e0b";
            let stemLeaf = false, beeStripes = "#1e293b", beeWing = "oval";
            let bgGrad = ["#f0fdf4", "#dcfce7"], flowerFace = false, beeCrown = false;
            let honeyDrop = false, ladybug = false, bee2Pos = "top";
            let petalCount = 5, beeCheeks = false, stemCurve = "right";
            let sparkles = false, sunCorner = false, beeTrail = false;
            let butterfly = false, potBelow = false;

            if (!isOriginal) {
                switch(diffType) {
                    case 'petal_color': flowerPetal = "#8b5cf6"; break;
                    case 'bee_single': beeCount = 1; break;
                    case 'flower_center': flowerCenter = "#ef4444"; break;
                    case 'stem_leaf': stemLeaf = true; break;
                    case 'bee_stripes': beeStripes = "#ec4899"; break;
                    case 'bee_wing': beeWing = "heart"; break;
                    case 'bg_color': bgGrad = ["#fef3c7", "#fde68a"]; break;
                    case 'flower_face': flowerFace = true; break;
                    case 'bee_crown': beeCrown = true; break;
                    case 'honey_drop': honeyDrop = true; break;
                    case 'ladybug': ladybug = true; break;
                    case 'bee2_position': bee2Pos = "low"; break;
                    case 'petal_count': petalCount = 6; break;
                    case 'bee_cheeks': beeCheeks = true; break;
                    case 'stem_curve': stemCurve = "left"; break;
                    case 'sparkles': sparkles = true; break;
                    case 'sun_corner': sunCorner = true; break;
                    case 'bee_trail': beeTrail = true; break;
                    case 'butterfly': butterfly = true; break;
                    case 'pot_below': potBelow = true; break;
                }
            }

            return `
                <radialGradient id="beeBg" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="${bgGrad[0]}"/>
                    <stop offset="100%" stop-color="${bgGrad[1]}"/>
                </radialGradient>
            </defs>
            <rect width="200" height="200" rx="16" fill="url(#beeBg)"/>

            ${sunCorner ? `<circle cx="25" cy="25" r="16" fill="#fbbf24"/>` : ''}
            ${sparkles ? `<text x="130" y="130" font-size="14">✨</text>` : ''}
            ${beeTrail ? `<path d="M 30 50 Q 80 20 120 50" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>` : ''}

            <g transform="translate(100, 120)" filter="url(#shadow)">
                <path d="M 0 30 Q ${stemCurve === 'right' ? '10' : '-15'} 50 0 70" stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round"/>
                
                ${stemLeaf ? `<path d="M 0 45 Q 20 40 25 50 Z" fill="#22c55e"/>` : ''}
                ${ladybug ? `<circle cx="-8" cy="42" r="4" fill="#ef4444"/><circle cx="-8" cy="42" r="1" fill="#000000"/>` : ''}

                <g fill="${flowerPetal}" stroke="#9f1239" stroke-width="1.5">
                    <circle cx="0" cy="-32" r="16"/>
                    <circle cx="28" cy="-10" r="16"/>
                    <circle cx="18" cy="24" r="16"/>
                    <circle cx="-18" cy="24" r="16"/>
                    <circle cx="-28" cy="-10" r="16"/>
                    ${petalCount === 6 ? `<circle cx="0" cy="32" r="16"/>` : ''}
                </g>
                <circle cx="0" cy="0" r="18" fill="${flowerCenter}" stroke="#78350f" stroke-width="1.5"/>

                ${flowerFace ? `<circle cx="-6" cy="-4" r="2" fill="#000000"/><circle cx="6" cy="-4" r="2" fill="#000000"/><path d="M -4 4 Q 0 8 4 4" stroke="#000000" stroke-width="1.5" fill="none"/>` : ''}
                ${honeyDrop ? `<path d="M 10 10 Q 15 25 10 28 Q 5 25 10 10 Z" fill="#f59e0b"/>` : ''}
            </g>

            ${potBelow ? `<rect x="80" y="170" width="40" height="22" fill="#d97706" rx="4"/>` : ''}

            <g transform="translate(60, 55) rotate(-15)" filter="url(#shadow)">
                ${beeWing === 'oval' ? `
                    <ellipse cx="-4" cy="-12" rx="7" ry="12" fill="#bae6fd" opacity="0.8"/>
                    <ellipse cx="6" cy="-12" rx="7" ry="12" fill="#bae6fd" opacity="0.8"/>
                ` : `
                    <text x="-12" y="-12" font-size="12">❤️</text>
                `}

                <ellipse cx="0" cy="0" rx="16" ry="12" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
                <path d="M -4 -11 L -4 11 M 3 -12 L 3 12" stroke="${beeStripes}" stroke-width="4"/>
                <circle cx="-9" cy="-2" r="2" fill="#1e293b"/>
                ${beeCheeks ? `<circle cx="-7" cy="3" r="2" fill="#f43f5e"/>` : ''}
                ${beeCrown ? `<text x="-6" y="-14" font-size="10">👑</text>` : ''}
            </g>

            ${beeCount === 2 ? `
                ${!butterfly ? `
                    <g transform="translate(145, ${bee2Pos === 'top' ? '60' : '110'}) scale(0.75) rotate(10)" filter="url(#shadow)">
                        <ellipse cx="-4" cy="-12" rx="7" ry="12" fill="#bae6fd" opacity="0.8"/>
                        <ellipse cx="6" cy="-12" rx="7" ry="12" fill="#bae6fd" opacity="0.8"/>
                        <ellipse cx="0" cy="0" rx="16" ry="12" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
                        <path d="M -4 -11 L -4 11 M 3 -12 L 3 12" stroke="${beeStripes}" stroke-width="4"/>
                        <circle cx="-9" cy="-2" r="2" fill="#1e293b"/>
                    </g>
                ` : `
                    <text x="135" y="65" font-size="20">🦋</text>
                `}
            ` : ''}
            `;
        }

        // 8. CAT & DOG
        function renderCatDog(isOriginal, diffType) {
            let catColor = "#f97316", accessory = "fish", dogEars = "down";
            let catEyes = "normal", dogColor = "#f8fafc", noAccessory = false;
            let catWhiskers = false, dogTongue = false, bgGrad = ["#ffedd5", "#fed7aa"];
            let heartBetween = false, catStripes = false, dogSpot = false;
            let ballToy = false, catBell = false, dogCollar = false;
            let pawsUp = false, pawPrints = false, catTail = false;
            let dogNose = "round", sparkleAround = false;

            if (!isOriginal) {
                switch(diffType) {
                    case 'cat_color': catColor = "#a855f7"; break;
                    case 'accessory_bone': accessory = "bone"; break;
                    case 'dog_ears': dogEars = "up"; break;
                    case 'cat_eyes': catEyes = "smile"; break;
                    case 'dog_color': dogColor = "#d97706"; break;
                    case 'no_accessory': noAccessory = true; break;
                    case 'cat_whiskers': catWhiskers = true; break;
                    case 'dog_tongue': dogTongue = true; break;
                    case 'bg_color': bgGrad = ["#fbcfe8", "#f472b6"]; break;
                    case 'heart_between': heartBetween = true; break;
                    case 'cat_stripes': catStripes = true; break;
                    case 'dog_spot': dogSpot = true; break;
                    case 'ball_toy': ballToy = true; break;
                    case 'cat_bell': catBell = true; break;
                    case 'dog_collar': dogCollar = true; break;
                    case 'paws_up': pawsUp = true; break;
                    case 'paw_prints': pawPrints = true; break;
                    case 'cat_tail': catTail = true; break;
                    case 'dog_nose': dogNose = "heart"; break;
                    case 'sparkle_around': sparkleAround = true; break;
                }
            }

            return `
                <linearGradient id="petBg" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${bgGrad[0]}"/>
                    <stop offset="100%" stop-color="${bgGrad[1]}"/>
                </linearGradient>
            </defs>
            <rect width="200" height="200" rx="16" fill="url(#petBg)"/>

            ${heartBetween ? `<text x="92" y="95" font-size="16">❤️</text>` : ''}
            ${sparkleAround ? `<text x="90" y="65" font-size="16">✨</text>` : ''}
            ${pawPrints ? `<text x="160" y="165" font-size="14">🐾</text>` : ''}

            <!-- Dog -->
            <g transform="translate(65, 115)" filter="url(#shadow)">
                <ellipse cx="0" cy="0" rx="26" ry="22" fill="${dogColor}" stroke="#334155" stroke-width="2"/>
                
                ${dogEars === 'down' ? `
                    <path d="M -22 -10 C -35 0 -30 20 -20 15 Z" fill="#64748b"/>
                    <path d="M 22 -10 C 35 0 30 20 20 15 Z" fill="#64748b"/>
                ` : `
                    <path d="M -20 -12 L -28 -30 L -10 -20 Z" fill="#64748b"/>
                    <path d="M 20 -12 L 28 -30 L 10 -20 Z" fill="#64748b"/>
                `}

                ${dogSpot ? `<circle cx="-10" cy="-4" r="8" fill="#334155" opacity="0.3"/>` : ''}

                <ellipse cx="0" cy="6" rx="12" ry="9" fill="#ffffff"/>
                ${dogNose === 'round' ? `<ellipse cx="0" cy="2" rx="4" ry="3" fill="#1e293b"/>` : `<text x="-4" y="6" font-size="8">❤️</text>`}

                ${dogTongue ? `<path d="M -2 8 Q 0 16 4 12 Z" fill="#ef4444"/>` : ''}

                <circle cx="-10" cy="-4" r="3" fill="#1e293b"/>
                <circle cx="10" cy="-4" r="3" fill="#1e293b"/>
                <circle cx="-9" cy="-5" r="1" fill="#ffffff"/>
                <circle cx="11" cy="-5" r="1" fill="#ffffff"/>

                <circle cx="-18" cy="4" r="4.5" fill="url(#blush)"/>
                <circle cx="18" cy="4" r="4.5" fill="url(#blush)"/>

                ${dogCollar ? `<rect x="-14" y="16" width="28" height="4" fill="#ef4444" rx="2"/>` : ''}
                ${pawsUp ? `<circle cx="-12" cy="18" r="5" fill="#ffffff" stroke="#334155"/><circle cx="12" cy="18" r="5" fill="#ffffff" stroke="#334155"/>` : ''}
            </g>

            <!-- Cat -->
            <g transform="translate(135, 110)" filter="url(#shadow)">
                ${catTail ? `<path d="M 20 15 Q 35 10 32 -5" stroke="${catColor}" stroke-width="5" fill="none" stroke-linecap="round"/>` : ''}

                <ellipse cx="0" cy="0" rx="24" ry="20" fill="${catColor}" stroke="#334155" stroke-width="2"/>
                
                <!-- Cat Ears -->
                <path d="M -18 -12 L -24 -30 L -6 -18 Z" fill="${catColor}" stroke="#334155" stroke-width="1.5"/>
                <path d="M -16 -14 L -20 -24 L -8 -18 Z" fill="#f472b6"/>
                <path d="M 18 -12 L 24 -30 L 6 -18 Z" fill="${catColor}" stroke="#334155" stroke-width="1.5"/>
                <path d="M 16 -14 L 20 -24 L 8 -18 Z" fill="#f472b6"/>

                ${catStripes ? `<path d="M -6 -16 L 0 -10 L 6 -16 M -4 -12 L 0 -8 L 4 -12" stroke="#78350f" stroke-width="2" fill="none"/>` : ''}

                <!-- Cat Eyes -->
                ${catEyes === 'normal' ? `
                    <ellipse cx="-8" cy="-2" rx="3.5" ry="4.5" fill="#10b981"/>
                    <circle cx="-8" cy="-2" r="2" fill="#0f172a"/>
                    <ellipse cx="8" cy="-2" rx="3.5" ry="4.5" fill="#10b981"/>
                    <circle cx="8" cy="-2" r="2" fill="#0f172a"/>
                ` : `
                    <path d="M -12 -2 Q -8 -7 -4 -2 M 4 -2 Q 8 -7 12 -2" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
                `}

                <polygon points="0,3 -3,6 3,6" fill="#f472b6"/>
                <path d="M -3 8 Q 0 11 3 8" stroke="#334155" stroke-width="1.5" fill="none"/>

                ${catWhiskers ? `
                    <line x1="-12" y1="4" x2="-26" y2="2" stroke="#334155" stroke-width="1.5"/>
                    <line x1="-12" y1="7" x2="-24" y2="9" stroke="#334155" stroke-width="1.5"/>
                    <line x1="12" y1="4" x2="26" y2="2" stroke="#334155" stroke-width="1.5"/>
                    <line x1="12" y1="7" x2="24" y2="9" stroke="#334155" stroke-width="1.5"/>
                ` : ''}

                <circle cx="-14" cy="4" r="4" fill="url(#blush)"/>
                <circle cx="14" cy="4" r="4" fill="url(#blush)"/>

                ${catBell ? `<circle cx="0" cy="18" r="4" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>` : ''}
            </g>

            <!-- Accessory Center -->
            ${!noAccessory ? `
                <g transform="translate(100, 160)" filter="url(#shadow)">
                    ${ballToy ? `
                        <circle cx="0" cy="0" r="10" fill="#ec4899"/>
                        <path d="M -10 0 A 10 10 0 0 1 10 0 Z" fill="#3b82f6"/>
                    ` : accessory === 'fish' ? `
                        <path d="M -12 0 C -4 -10 8 -10 12 0 C 8 10 -4 10 -12 0 Z" fill="#38bdf8"/>
                        <polygon points="-12,0 -18,-6 -18,6" fill="#0284c7"/>
                        <circle cx="6" cy="-2" r="1.5" fill="#0f172a"/>
                    ` : `
                        <path d="M -12 -3 C -10 -8 -5 -8 -3 -3 L 3 -3 C 5 -8 10 -8 12 -3 C 14 -1 14 1 12 3 L 3 3 C 5 8 10 8 12 3 L -3 3 C -5 8 -10 8 -12 3 C -14 1 -14 -1 -12 -3 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
                    `}
                </g>
            ` : ''}
            `;
        }
    </script>
</body>
</html>
